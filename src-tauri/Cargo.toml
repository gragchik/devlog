[package]
name = "devlog"
version = "0.0.0"
description = "DevLog — персональный автоматический Worklog для Windows"
edition = "2021"
rust-version = "1.85" # фактический MSRV после добавления uuid 1.26 (см. Cargo.lock)

[lib]
# Tauri 2 требует отдельного cdylib-таргета для мобильных платформ;
# на Windows нам нужен только обычный бинарник, но структура main.rs -> lib.rs
# — стандартная конвенция Tauri (упрощает добавление мобильных таргетов позже).
name = "devlog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.20.0", features = ["v4"] }
anyhow = "1.0.104"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation"] }
regex = "1.13.1"
chrono = "0.4.45"
iana-time-zone = "0.1.65"
tauri-plugin-autostart = "2.5.1"
reqwest = { version = "0.13.5", features = ["json", "query"] }
async-trait = "0.1.92"
keyring = { version = "3.6.3", features = ["windows-native"] }
sha2 = "0.11.0"
tauri-plugin-dialog = "2"

[[bin]]
name = "devlog"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
